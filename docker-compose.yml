version: "3.8"

services:
  apartment-stats-authentik-proxy:
    image: ghcr.io/goauthentik/proxy:2026.8.3
    restart: unless-stopped
    shm_size: "512mb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/outpost.goauthentik.io/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coolify
    user: "0:0"
    volumes:
      - apartment-stats-outpost-sessions:/sessions
    environment:
      - AUTHENTIK_HOST=https://auth.brianwirth.de
      - AUTHENTIK_INSECURE=false
      - AUTHENTIK_TOKEN=${AUTHENTIK_TOKEN}
      - TMPDIR=/sessions
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.apartment-stats-authentik-proxy.rule=Host(`apartment-stats.brianwirth.de`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.apartment-stats-authentik-proxy.priority=15"
      - "traefik.http.routers.apartment-stats-authentik-proxy.entrypoints=https"
      - "traefik.http.routers.apartment-stats-authentik-proxy.tls=true"
      - "traefik.http.routers.apartment-stats-authentik-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.apartment-stats-authentik-proxy.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.apartment-stats-authentik.forwardauth.address=http://apartment-stats-authentik-proxy:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.apartment-stats-authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.apartment-stats-authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"

  web:
    container_name: apartment-stats-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.apartment-stats.rule=Host(`apartment-stats.brianwirth.de`)"
      - "traefik.http.routers.apartment-stats.priority=10"
      - "traefik.http.routers.apartment-stats.entrypoints=https"
      - "traefik.http.routers.apartment-stats.tls=true"
      - "traefik.http.routers.apartment-stats.tls.certresolver=letsencrypt"
      - "traefik.http.routers.apartment-stats.middlewares=apartment-stats-authentik@docker"
      - "traefik.http.services.apartment-stats.loadbalancer.server.port=80"
      - "homepage.group=Apps"
      - "homepage.name=Apartment Stats"
      - "homepage.icon=/images/apartment-stats.svg"
      - "homepage.href=https://apartment-stats.brianwirth.de/"
      - "homepage.description=Homematic IP apartment climate analytics"

networks:
  coolify:
    external: true

volumes:
  apartment-stats-outpost-sessions:
